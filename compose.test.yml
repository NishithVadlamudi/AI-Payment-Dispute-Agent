name: ai-dispute-test-db
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Run npm run db:test:start first}
    volumes:
      - test-db-data:/var/lib/postgresql/data
      - ./supabase/test/bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
      - ./supabase/migrations/0001_foundation.sql:/docker-entrypoint-initdb.d/01-foundation.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 2s
      timeout: 3s
      retries: 30
  rest:
    image: postgrest/postgrest:v13.0.4
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:${TEST_DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${TEST_JWT_SECRET:?Run npm run db:test:start first}
  gateway:
    image: nginx:1.28-alpine
    depends_on: [rest]
    ports: ['127.0.0.1:54321:80']
    volumes:
      - ./supabase/test/nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  test-db-data:

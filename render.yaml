services:
  - type: web
    name: resolve-payments
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PGRST_JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_BUDGET_PROVIDER
        value: gemini
      - key: AI_BUDGET_MODEL
        value: gemini-3.5-flash-lite
